<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <header class="top small"><button class="btn link" onclick="location.href='index.html'">← Home</button><h1>Login</h1></header>
  <main class="card auth-card">
    <label>Username</label><input id="username" class="text-input" />
    <label>Password</label><input id="password" type="password" class="text-input" />
    <div style="margin-top:12px">
      <button id="doLogin" class="btn primary">Login</button>
      <a href="signup.html" class="btn link">Create account</a>
    </div>
    <div id="msg" class="muted small"></div>
  </main>
</div>
<script src="script.js"></script>
<script>
document.getElementById('doLogin').addEventListener('click', ()=>{
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const r = Users.login(u,p);
  const msg = document.getElementById('msg');
  if(r.ok){ msg.textContent = 'Login success'; setTimeout(()=> location.href='dashboard.html',500); }
  else { msg.textContent = 'Error: ' + r.error; }
});
</script>
</body>
</html>
