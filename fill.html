<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fill in the Blanks</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <header class="top small">
    <button class="btn link" onclick="location.href='index.html'">← Home</button>
    <h1>Fill in the Blanks</h1>
    <p class="muted">30s per question · 20 questions per season</p>
  </header>
  <main class="card practice-card">
    <div class="scorebar">
      <div>Season: <span id="seasonNo">1</span></div>
      <div>Q <span id="qIndex">0</span>/20</div>
      <div>Points: <span id="points">0</span></div>
    </div>
    <div id="sentenceBox" class="sentence-box">Loading…</div>
    <div class="timer-wrap">
      <div id="timerLabel">30</div>
      <div class="timer-bar"><div id="timerProgress"></div></div>
    </div>
    <input id="answerInput" class="text-input" placeholder="Type the missing word" autocomplete="off" />
    <div class="controls">
      <button id="submitBtn" class="btn large green">Submit</button>
      <button id="nextBtn" class="btn large outline">Next</button>
      <button id="hintBtn" class="btn small">Hint</button>
    </div>
    <div id="fbResult" class="result muted"></div>
    <div class="footer-controls">
      <label><input type="checkbox" id="caseSensitive"> Case sensitive</label>
      <button class="btn link" id="endSeason">End season</button>
    </div>
  </main>
</div>
<script src="script.js"></script>
<script>
(async function(){ await app.ensureDatasetsReady(); FillUI.init(); })();
</script>
</body>
</html>
